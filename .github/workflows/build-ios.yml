name: Build iOS IPA (non signé)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**.md"

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Compilation iOS sans signature
        run: flutter build ios --release --no-codesign

      - name: Empaqueter en .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr pooring_bele.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: pooring-bele-ipa
          path: pooring_bele.ipa
          retention-days: 14
